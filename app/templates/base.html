<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Instagram Saved Posts Organizer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="{{ url_for('main.index') }}" class="logo">📸 IG Organizer</a>
            <ul class="nav-menu">
                <li><a href="{{ url_for('main.index') }}">Dashboard</a></li>
                <li><a href="{{ url_for('posts.list_posts') }}">Posts</a></li>
                <li><a href="{{ url_for('categories.list_categories') }}">Categories</a></li>
                <li><a href="{{ url_for('main.search') }}">Search</a></li>
                <li><a href="{{ url_for('main.settings') }}">Settings</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Instagram Saved Posts Organizer</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
